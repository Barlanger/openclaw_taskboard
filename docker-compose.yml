services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: nerdblog-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nerdblog
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - nerdblog-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nerdblog-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/nerdblog
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nerdblog-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Angular App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nerdblog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nerdblog-network

networks:
  nerdblog-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
