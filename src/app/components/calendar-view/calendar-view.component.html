<div class="calendar-container">
  <div class="calendar-header">
    <button class="nav-button" (click)="previousMonth()">◀</button>
    <h2>{{ getMonthName() }}</h2>
    <button class="nav-button" (click)="nextMonth()">▶</button>
  </div>

  <div class="calendar-grid">
    <div class="weekday-header" *ngFor="let day of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">
      {{ day }}
    </div>

    <div *ngFor="let week of weeks">
      <div 
        *ngFor="let day of week" 
        class="calendar-day"
        [class.other-month]="!isCurrentMonth(day)"
        [class.today]="isToday(day)">
        <div class="day-number">{{ day.getDate() }}</div>
        <div class="tasks-preview">
          <div 
            *ngFor="let task of getTasksForDate(day).slice(0, 2)" 
            class="task-indicator"
            [class.priority-high]="task.priority === 'HIGH'"
            [class.priority-medium]="task.priority === 'MEDIUM'"
            [class.priority-low]="task.priority === 'LOW'">
            {{ task.title }}
          </div>
          <div *ngIf="getTasksForDate(day).length > 2" class="more-tasks">
            +{{ getTasksForDate(day).length - 2 }} more
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
