<div class="login-container">
  <div class="login-card">
    <h1>Welcome to TaskBoard</h1>
    <p class="subtitle">Sign in to access blog posts and admin features</p>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label for="name">Name (optional)</label>
        <input
          type="text"
          id="name"
          [(ngModel)]="name"
          name="name"
          placeholder="Your name"
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading" class="login-button">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="quick-login">
      <p>Quick login for testing:</p>
      <button (click)="quickLogin('admin@taskboard.com', 'Admin User')" class="quick-btn admin">
        🔐 Login as Admin
      </button>
      <button (click)="quickLogin('user@taskboard.com', 'Regular User')" class="quick-btn user">
        👤 Login as User
      </button>
    </div>

    <p class="info-text">
      <strong>Note:</strong> This is a development login. Admin user can create blog posts, 
      regular user can only comment.
    </p>
  </div>
</div>
