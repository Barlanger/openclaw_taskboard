<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>TaskBoard Dashboard</h1>
    <div class="header-actions">
      <button class="btn-create-task" (click)="openTaskForm()">
        <span class="icon">+</span> Create Task
      </button>
      <div class="view-toggle">
        <button 
          [class.active]="activeView === 'both'"
          (click)="setView('both')">
          Both Views
        </button>
        <button 
          [class.active]="activeView === 'kanban'"
          (click)="setView('kanban')">
          Kanban
        </button>
        <button 
          [class.active]="activeView === 'calendar'"
          (click)="setView('calendar')">
          Calendar
        </button>
      </div>
    </div>
  </header>

  <div class="dashboard-content">
    <div *ngIf="activeView === 'both'" class="both-views">
      <section class="section">
        <h2>Calendar View</h2>
        <app-calendar-view></app-calendar-view>
      </section>
      
      <section class="section">
        <h2>Kanban Board</h2>
        <app-kanban-board></app-kanban-board>
      </section>
    </div>

    <div *ngIf="activeView === 'kanban'" class="single-view">
      <app-kanban-board></app-kanban-board>
    </div>

    <div *ngIf="activeView === 'calendar'" class="single-view">
      <app-calendar-view></app-calendar-view>
    </div>
  </div>

  <app-task-form
    [isOpen]="isTaskFormOpen"
    [task]="taskToEdit"
    (save)="saveTask($event)"
    (cancel)="closeTaskForm()">
  </app-task-form>
</div>
