# mise configuration for TaskBoard_Me project
# Install mise: https://mise.jdx.dev/getting-started.html
# Usage: Run `mise install` to install all tools

[tools]
# Node.js for Angular frontend (v20.19+ or v22.12+ required)
node = "22.12.0"

# Java for Spring Boot backend (v21 required)
java = "temurin-21.0.5+11"

# Maven for backend build (v3.6+ required)
maven = "3.9.6"

[env]
# Environment variables for the project
_.file = ".env"

# Java configuration
JAVA_HOME = "{{config_root}}/.mise/installs/java/temurin-21.0.5+11"

# Maven configuration  
MAVEN_OPTS = "-Xmx1024m"
